<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amazon Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header -->
<header>
    <div class="logo">amazon</div>
    <input type="text" placeholder="Search Amazon">
    <button>Search</button>
</header>

<!-- Navigation -->
<nav>
    <a href="#">Home</a>
    <a href="#">Deals</a>
    <a href="#">Mobiles</a>
    <a href="#">Fashion</a>
</nav>

<!-- Banner -->
<section class="banner">
    <h1>Welcome to Amazon Clone</h1>
</section>

<!-- Products -->
<section class="products">

    <div class="product">
        <img src="https://via.placeholder.com/150">
        <h3>Product 1</h3>
        <p>₹999</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/150">
        <h3>Product 2</h3>
        <p>₹1499</p>
        <button>Add to Cart</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/150">
        <h3>Product 3</h3>
        <p>₹1999</p>
        <button>Add to Cart</button>
    </div>

</section>

<!-- Footer -->
<footer>
    <p>© 2026 Amazon Clone</p>
</footer>

</body>
</html>

<!-- Products -->
<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Smartphone</h3>
        <p>₹15,000</p>
        <button onclick="addToCart('Smartphone')">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Laptop</h3>
        <p>₹50,000</p>
        <button onclick="addToCart('Laptop')">Add to Cart</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Headphones</h3>
        <p>₹2,000</p>
        <button onclick="addToCart('Headphones')">Add to Cart</button>
    </div>

</section>

<!-- Cart -->
<section class="cart">
    <h2>Cart</h2>
    <ul id="cart-list"></ul>
</section>

<script src="script.js"></script>
</body>
</html>
